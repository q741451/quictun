name: Build

on:
  push:
    branches: [ quictun ]
  pull_request:
    branches: [ quictun ]
  workflow_dispatch:

# Binaries built on every run. These are QUICHE's own tools (this branch is
# a vendored QUICHE snapshot, no quictun-specific application code yet).
env:
  TARGETS: >-
    //quiche:quic_client
    //quiche:quic_server
    //quiche:masque_client
    //quiche:masque_server

jobs:
  build:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BoringSSL/abseil/protobuf/googleurl are all built from source via
      # quiche's own Bazel setup -- that's the single biggest cost in this
      # job, so cache Bazel's repository + build output caches keyed on the
      # lockfile and .bazelrc. A hit here turns a ~20-30 min cold build
      # into a couple of minutes.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # Ubuntu's default clang is too old for this quiche snapshot's
      # vendored Chromium base/ code (hits real compiler-conformance
      # issues around C++20/23 constexpr and `typename` requirements).
      # clang-18 is the version verified to work.
      - name: Install clang-18
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18

      - name: Install bazelisk
        run: |
          curl -fsSL -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /tmp/bazelisk
          sudo mv /tmp/bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Build
        env:
          CC: clang-18
        run: |
          set -e
          nproc
          # .bazelrc already carries the Chromium-aligned default flags
          # (OPENSSL_SMALL, fno-rtti/exceptions, hidden visibility,
          # function/data sections, bundled ICU, etc). Only add what's
          # specific to this CI artifact: static linking + stripped size.
          bazel build -c opt \
            --linkopt=-static \
            --linkopt=-s \
            $TARGETS

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p dist
          for t in $TARGETS; do
            name=${t#//quiche:}
            cp "bazel-bin/quiche/$name" "dist/${name}-linux-x86_64"
          done
          chmod +x dist/*
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q "statically linked" || { echo "::error::$f is not statically linked"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiche-tools-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-arm64:
    name: Build (arm64, cross-compiled)
    runs-on: ubuntu-latest
    # Real cross-compilation, same as Chromium's actual arm64 build: clang
    # supports multiple targets out of the box (--target=aarch64-linux-gnu),
    # so this produces arm64 object code directly on the x86_64 runner --
    # no arm64 instruction ever executes during the build, and there is no
    # QEMU/emulation anywhere in this job. See build/toolchain/BUILD.bazel
    # for the cc_toolchain definition and //build/toolchain:linux_arm64 for
    # the target platform selected below via --platforms.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bazel (arm64)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-arm64
            ~/.cache/bazelisk
          key: bazel-arm64-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/BUILD.bazel') }}
          restore-keys: |
            bazel-arm64-

      # Same clang-18 as the x86_64 job (it natively supports emitting
      # aarch64 code via -target=), plus Debian/Ubuntu's multiarch aarch64
      # cross-libc/binutils packages that build/toolchain/BUILD.bazel's
      # cc_toolchain points at.
      - name: Install clang-18 and aarch64 cross toolchain
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross binutils-aarch64-linux-gnu

      - name: Install bazelisk
        run: |
          curl -fsSL -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /tmp/bazelisk
          sudo mv /tmp/bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Build
        run: |
          set -e
          nproc
          bazel build -c opt \
            --platforms=//build/toolchain:linux_arm64 \
            --linkopt=-static \
            --linkopt=-s \
            $TARGETS

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p dist
          for t in $TARGETS; do
            name=${t#//quiche:}
            cp "bazel-bin/quiche/$name" "dist/${name}-linux-arm64"
          done
          chmod +x dist/*
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q "ARM aarch64" || { echo "::error::$f is not an aarch64 binary"; exit 1; }
            file "$f" | grep -q "statically linked" || { echo "::error::$f is not statically linked"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiche-tools-linux-arm64
          path: dist/*
          if-no-files-found: error
