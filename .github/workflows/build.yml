name: Build

on:
  push:
    branches: [ quictun ]
  pull_request:
    branches: [ quictun ]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also run testing/smoke on Windows, macOS and Linux runners
        type: boolean
        default: false
  # Lets release.yml call this workflow's own build job directly (same
  # matrix, same toolchain, same artifacts) instead of duplicating it --
  # a release is built exactly the same way as every regular CI run.
  workflow_call:

# Binaries built and released on every run: just the quictun TCP-over-QUIC
# tunnel tool itself. QUICHE's own upstream example tools (quic_client,
# quic_server, masque_client, masque_server) remain in the tree and buildable
# on demand (e.g. `bazel build //quiche:quic_client`) for reference/debugging,
# but are no longer part of this fork's default build/release output.
env:
  TARGETS: >-
    //quiche:quictun_client
    //quiche:quictun_server
  # Bazelisk, which fetches the Bazel that .bazelversion pins. Downloaded at a
  # fixed version and checked, the same way on Linux and macOS, rather than
  # whatever `latest` or the runner image happens to carry. Its download of
  # Bazel itself goes under BAZELISK_HOME, which the Bazel cache saves.
  BAZELISK_VERSION: v1.29.0
  BAZELISK_LINUX_AMD64_SHA256: 5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992
  BAZELISK_DARWIN_ARM64_SHA256: cee851f726789227d5561004e9904a52be45c3efb56f8b38b6993d6adbaa0409

jobs:
  build-linux:
    name: Build (linux-${{ matrix.name }})
    runs-on: ubuntu-latest
    # Every architecture (including x86_64) uses the same from-scratch,
    # pinned toolchain -- Chromium's own pinned clang, a from-source musl,
    # and a from-source libc++ built by that clang against that musl --
    # built by build/toolchain/setup_toolchain.sh
    # and wired into Bazel via build/toolchain/BUILD.bazel's --platforms.
    # See that BUILD.bazel file's header comment for the full rationale:
    # in short, none of this depends on the runner image at all: no apt, no
    # sudo, no /usr/include, no system libc. Depending on the distro is what
    # broke this project's mipsel build once already (see git history).
    #
    # Plain big-endian mips is deliberately not in this matrix: quiche's
    # own README states it only supports little-endian platforms, and
    # that's a correctness concern (silently wrong crypto/wire-format
    # handling), not just a build-break one. mipsel (little-endian) is.
    strategy:
      fail-fast: false
      matrix:
        include:
          # No per-arch static_flag any more: musl ships rcrt1.o on every
          # architecture, so -static-pie works uniformly and now lives in
          # toolchain_flags.bzl rather than here -- it has to reach the exec
          # configuration too, which a CI --linkopt does not (host tools would
          # come out linked against a musl loader the runner doesn't have).
          - name: x86_64
            arch: x64
            platform: linux_x64
            file_match: "x86-64"
          - name: x86
            arch: x86
            platform: linux_x86
            file_match: "Intel 80386"
          - name: arm64
            arch: arm64
            platform: linux_arm64
            file_match: "ARM aarch64"
          - name: armv7
            arch: armv7
            platform: linux_armv7
            file_match: "ARM,"
          - name: mipsel
            arch: mipsel
            platform: linux_mipsel
            file_match: "MIPS,"
          - name: riscv64
            arch: riscv64
            platform: linux_riscv64
            file_match: "UCB RISC-V"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain itself (pinned clang download + from-source libc++
      # build) doesn't change unless the pins in setup_toolchain.sh do, so
      # it's cached separately from -- and is a much bigger win than --
      # Bazel's own repository/output caches below: a hit here skips
      # several minutes of `ninja` building libc++/libc++abi/libunwind
      # from source.
      # Every cross-compile job (arm64/armv7/mipsel) also needs a full x64
      # toolchain, not just its target arch's: Bazel builds a handful of
      # build-time tool dependencies (protoc and its transitive deps, e.g.
      # abseil "[for tool]" targets) for the *exec* platform, which is the
      # x64 GitHub runner itself, regardless of --platforms=. Confirmed by
      # a real CI failure (all three cross jobs failed identically with
      # "cstdint file not found" while compiling absl "[for tool]" targets
      # against the x64 libc++ include path, because that directory simply
      # didn't exist yet on those runners).
      #
      # Restored and saved as separate steps, each save right after the step
      # that fills it: the all-in-one actions/cache only saves when the whole
      # job succeeds.
      - name: Restore toolchain (linux-${{ matrix.name }})
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/out
          # uapi/** is in the key as well as the script: setup_toolchain.sh
          # copies the vendored asm/ headers into the sysroot from inside its
          # "is musl already built?" guard, so a cache hit skips that copy
          # entirely. Without the headers in the key, regenerating them (a
          # kernel bump via uapi/regenerate.sh) leaves every runner building
          # against the *old* UAPI, silently and with no version to notice.
          key: toolchain-linux-${{ matrix.name }}-${{ hashFiles('build/toolchain/setup_toolchain.sh', 'build/toolchain/uapi/**') }}

      - name: Set up pinned toolchain (linux-${{ matrix.name }})
        run: |
          set -e
          bash build/toolchain/setup_toolchain.sh x64
          if [ "${{ matrix.arch }}" != "x64" ]; then
            bash build/toolchain/setup_toolchain.sh ${{ matrix.arch }}
          fi

      - name: Save toolchain (linux-${{ matrix.name }})
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/toolchain/out
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      # BoringSSL/abseil/protobuf/googleurl are all built from source via
      # quiche's own Bazel setup -- that's the single biggest cost in this
      # job besides the toolchain itself, so cache Bazel's repository + build
      # output caches. The key ends in the run id so that every run saves its
      # own copy (a cache entry can never be overwritten), and restore takes
      # the newest by prefix. Bazel's disk cache is content-addressed, so a
      # copy saved from a failed build still holds only correct outputs.
      - name: Restore Bazel (linux-${{ matrix.name }})
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-linux-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-linux-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/*.bzl', 'build/toolchain/BUILD.bazel') }}-${{ github.run_id }}
          restore-keys: |
            bazel-linux-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/*.bzl', 'build/toolchain/BUILD.bazel') }}-
            bazel-linux-${{ matrix.name }}-

      - name: Install bazelisk
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/bazelisk" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          echo "$BAZELISK_LINUX_AMD64_SHA256  $RUNNER_TEMP/bin/bazelisk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazelisk"
          ln -sf bazelisk "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "BAZELISK_HOME=$HOME/.cache/bazelisk" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: |
          set -e
          # See build/regen_quictun_build_timestamp.sh's own comment: this
          # is what makes quictun's startup banner show this actual build's
          # real time rather than a stale one frozen by Bazel's cache.
          ./build/regen_quictun_build_timestamp.sh
          # The toolchain already carries the Chromium-aligned default flags
          # (build/toolchain/compiler_flags.bzl: no RTTI/exceptions, hidden
          # visibility, function/data sections) and static linking
          # (toolchain_flags.bzl), and .bazelrc the rest (OPENSSL_SMALL,
          # bundled ICU). Only add what's specific to this CI artifact:
          # stripped size.
          # -fno-asynchronous-unwind-tables: the toolchain already builds
          # with -fno-exceptions, but the x86-64 psABI still emits .eh_frame
          # for every function regardless, and nothing here unwinds through
          # it (no exceptions, no pthread_cancel). Dropping it takes ~300KB
          # off each binary -- ~7% raw, ~5% after the xz that OpenWrt's
          # squashfs applies -- with .text byte-identical either way. The
          # cost is that perf/gdb can no longer walk user-space stacks in
          # release artifacts, so this is deliberately set here rather than
          # in the toolchain: local builds keep full unwind info for
          # debugging.
          #
          # --disk_cache / --repository_cache: the "Restore Bazel" step above
          # only restores ~/.cache/bazel-linux-${{ matrix.name }} as a plain
          # tarball -- it doesn't make Bazel actually *use* that directory
          # for anything. Without these two flags, Bazel's real action
          # cache lives in its default output_user_root instead (something
          # like ~/.cache/bazel/_bazel_runner/<hash>, never cached), so
          # every run was silently recompiling all ~1700 actions from
          # scratch despite the cache step reporting a hit every time
          # (confirmed via `bazel build`'s own summary line, e.g.
          # "2065 processes: 343 internal, 1722 processwrapper-sandbox" --
          # zero disk-cache hits). Pointing both at the actually-cached
          # directory is what makes the restored tarball mean anything.
          bazel build -c opt \
            --disk_cache=$HOME/.cache/bazel-linux-${{ matrix.name }}/disk \
            --repository_cache=$HOME/.cache/bazel-linux-${{ matrix.name }}/repo \
            --platforms=//build/toolchain:${{ matrix.platform }} \
            --copt=-fno-asynchronous-unwind-tables \
            --linkopt=-s \
            $TARGETS

      - name: Save Bazel (linux-${{ matrix.name }})
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-linux-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-linux-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/*.bzl', 'build/toolchain/BUILD.bazel') }}-${{ github.run_id }}

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p dist
          for t in $TARGETS; do
            name=${t#//quiche:}
            cp "bazel-bin/quiche/$name" "dist/${name}-linux-${{ matrix.name }}"
          done
          chmod +x dist/*
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q '${{ matrix.file_match }}' || { echo "::error::$f is not a ${{ matrix.name }} binary"; exit 1; }
            file "$f" | grep -qE "statically linked|static-pie linked" || { echo "::error::$f is not statically linked"; exit 1; }
            ls -l "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quictun-linux-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # macOS, both architectures, built on an Apple silicon runner with the same
  # pinned clang as Linux (its Mac package) and a from-source static libc++;
  # x86_64 is a cross build. Apple's SDK may only be used on a Mac, so this
  # cannot run on the Linux runners. See build/toolchain/setup_toolchain_macos.sh.
  build-macos:
    name: Build (macos-${{ matrix.name }})
    # A fixed image, not macos-latest: the Xcode below has to exist on it.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            arch: arm64
            platform: macos_arm64
            file_match: "arm64"
          - name: x86_64
            arch: x64
            platform: macos_x64
            file_match: "x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SDK is part of Xcode, so pinning the SDK means pinning Xcode.
      # setup_toolchain_macos.sh refuses any SDK but the one it expects, so a
      # runner image that drops this Xcode fails here, not with a different
      # SDK.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      # Caches are restored and saved as separate steps, each save right
      # after the step that fills it: the all-in-one actions/cache only
      # saves when the whole job succeeds.
      - name: Restore toolchain (macos-${{ matrix.name }})
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/out
          # setup_toolchain.sh is in the key too: the clang version and LLVM
          # commit are read from it.
          key: toolchain-macos-${{ matrix.name }}-${{ hashFiles('build/toolchain/setup_toolchain_macos.sh', 'build/toolchain/setup_toolchain.sh') }}

      # arm64 every time: it is also the host Bazel builds its tools for.
      - name: Set up pinned toolchain (macos-${{ matrix.name }})
        run: |
          set -e
          bash build/toolchain/setup_toolchain_macos.sh arm64
          if [ "${{ matrix.arch }}" != "arm64" ]; then
            bash build/toolchain/setup_toolchain_macos.sh ${{ matrix.arch }}
          fi

      - name: Save toolchain (macos-${{ matrix.name }})
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/toolchain/out
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      # The key ends in the run id so that every run saves its own copy (a
      # cache entry can never be overwritten), and restore takes the newest
      # by prefix. Bazel's disk cache is content-addressed, so a copy saved
      # from a failed build still holds only correct outputs.
      - name: Restore Bazel (macos-${{ matrix.name }})
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-macos-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-macos-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/compiler_flags.bzl', 'build/toolchain/macos/*.bzl', 'build/toolchain/macos/BUILD.bazel') }}-${{ github.run_id }}
          restore-keys: |
            bazel-macos-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/compiler_flags.bzl', 'build/toolchain/macos/*.bzl', 'build/toolchain/macos/BUILD.bazel') }}-
            bazel-macos-${{ matrix.name }}-

      - name: Install bazelisk
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/bazelisk" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-darwin-arm64"
          echo "$BAZELISK_DARWIN_ARM64_SHA256  $RUNNER_TEMP/bin/bazelisk" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/bazelisk"
          ln -sf bazelisk "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "BAZELISK_HOME=$HOME/.cache/bazelisk" >> "$GITHUB_ENV"

      # The same flags as the Linux build, for the same reasons (see there),
      # except -s: ld64 treats it as obsolete and strips nothing, so the
      # binaries are stripped with the pinned llvm-strip when staged.
      # Mach-O also carries two tables that only debuggers and profilers
      # read and that ELF has no counterpart of, LC_FUNCTION_STARTS and
      # LC_DATA_IN_CODE; they are left out as Chromium's official macOS
      # builds leave them out (build/config/compiler/BUILD.gn).
      - name: Build
        id: build
        run: |
          set -e
          ./build/regen_quictun_build_timestamp.sh
          bazel build -c opt \
            --disk_cache=$HOME/.cache/bazel-macos-${{ matrix.name }}/disk \
            --repository_cache=$HOME/.cache/bazel-macos-${{ matrix.name }}/repo \
            --platforms=//build/toolchain/macos:${{ matrix.platform }} \
            --copt=-fno-asynchronous-unwind-tables \
            --linkopt=-Wl,-no_function_starts \
            --linkopt=-Wl,-no_data_in_code_info \
            $TARGETS

      - name: Save Bazel (macos-${{ matrix.name }})
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-macos-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-macos-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/compiler_flags.bzl', 'build/toolchain/macos/*.bzl', 'build/toolchain/macos/BUILD.bazel') }}-${{ github.run_id }}

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p dist
          for t in $TARGETS; do
            name=${t#//quiche:}
            cp "bazel-bin/quiche/$name" "dist/${name}-macos-${{ matrix.name }}"
          done
          chmod u+w,+x dist/*
          build/toolchain/out/chromium-clang-mac/bin/llvm-strip dist/*
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q '${{ matrix.file_match }}' || { echo "::error::$f is not a ${{ matrix.name }} binary"; exit 1; }
            otool -L "$f"
            # Only system libraries: libc++ is linked in statically.
            if otool -L "$f" | tail -n +2 | grep -vE '^\s+/(usr/lib|System/Library)/'; then
              echo "::error::$f links a non-system library"; exit 1
            fi
            if otool -L "$f" | grep -q 'libc++'; then
              echo "::error::$f links the system libc++ instead of the static one"; exit 1
            fi
            vtool -show-build "$f"
            ls -l "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quictun-macos-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Windows, cross-built on the Linux runners as Chromium cross-builds it:
  # the same pinned clang driven as clang-cl/lld-link, a from-source static
  # libc++ on the static MSVC runtime, and Microsoft's SDK and CRT fetched at
  # pinned versions by xwin. See build/toolchain/setup_toolchain_windows.sh.
  build-windows:
    name: Build (windows-${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            arch: x64
            platform: windows_x64
            file_match: "PE32+ executable (console) x86-64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux x64 toolchain as well as the Windows one: it provides the
      # clang-cl and lld-link, and builds the tools Bazel runs on the host.
      - name: Restore toolchain (windows-${{ matrix.name }})
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: build/toolchain/out
          key: toolchain-windows-${{ matrix.name }}-${{ hashFiles('build/toolchain/setup_toolchain.sh', 'build/toolchain/setup_toolchain_windows.sh', 'build/toolchain/uapi/**') }}

      - name: Set up pinned toolchain (windows-${{ matrix.name }})
        run: |
          set -e
          bash build/toolchain/setup_toolchain.sh x64
          bash build/toolchain/setup_toolchain_windows.sh ${{ matrix.arch }}

      - name: Save toolchain (windows-${{ matrix.name }})
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/toolchain/out
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Restore Bazel (windows-${{ matrix.name }})
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bazel-windows-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-windows-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/*.bzl', 'build/toolchain/BUILD.bazel', 'build/toolchain/windows/*.bzl', 'build/toolchain/windows/BUILD.bazel') }}-${{ github.run_id }}
          restore-keys: |
            bazel-windows-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/*.bzl', 'build/toolchain/BUILD.bazel', 'build/toolchain/windows/*.bzl', 'build/toolchain/windows/BUILD.bazel') }}-
            bazel-windows-${{ matrix.name }}-

      - name: Install bazelisk
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/bazelisk" \
            "https://github.com/bazelbuild/bazelisk/releases/download/$BAZELISK_VERSION/bazelisk-linux-amd64"
          echo "$BAZELISK_LINUX_AMD64_SHA256  $RUNNER_TEMP/bin/bazelisk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/bazelisk"
          ln -sf bazelisk "$RUNNER_TEMP/bin/bazel"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "BAZELISK_HOME=$HOME/.cache/bazelisk" >> "$GITHUB_ENV"

      # The Linux build's CI-only flags have no Windows counterpart to pass:
      # x64 Windows requires unwind tables (.pdata/.xdata) of every function,
      # so -fno-asynchronous-unwind-tables does not apply, and lld-link puts
      # no symbol table in the image without /DEBUG, so there is nothing for
      # -s to strip.
      - name: Build
        id: build
        run: |
          set -e
          ./build/regen_quictun_build_timestamp.sh
          bazel build -c opt --config=windows \
            --disk_cache=$HOME/.cache/bazel-windows-${{ matrix.name }}/disk \
            --repository_cache=$HOME/.cache/bazel-windows-${{ matrix.name }}/repo \
            --platforms=//build/toolchain/windows:${{ matrix.platform }} \
            $TARGETS

      - name: Save Bazel (windows-${{ matrix.name }})
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/bazel-windows-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-windows-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/*.bzl', 'build/toolchain/BUILD.bazel', 'build/toolchain/windows/*.bzl', 'build/toolchain/windows/BUILD.bazel') }}-${{ github.run_id }}

      # The counterpart of Linux's "statically linked" check: the images may
      # import only DLLs that ship with Windows itself, never a runtime one
      # (VCRUNTIME*, MSVCP*, ucrtbase, api-ms-win-crt-*), which would mean
      # /MT or the static libc++ did not take.
      - name: Stage artifacts
        run: |
          set -e
          READOBJ=build/toolchain/out/chromium-clang/bin/llvm-readobj
          mkdir -p dist
          for t in $TARGETS; do
            name=${t#//quiche:}
            cp "bazel-bin/quiche/$name.exe" "dist/${name}-windows-${{ matrix.name }}.exe"
          done
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q '${{ matrix.file_match }}' || { echo "::error::$f is not a ${{ matrix.name }} console executable"; exit 1; }
            dlls=$($READOBJ --coff-imports "$f" | awk '/Name:/{print toupper($2)}' | sort -u)
            echo "$dlls"
            if echo "$dlls" | grep -E '^(VCRUNTIME|MSVCP|UCRTBASE|API-MS-WIN-CRT-|LIBC\+\+)'; then
              echo "::error::$f depends on a runtime DLL"; exit 1
            fi
            ls -l "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quictun-windows-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Off unless asked for: run Build by hand with "smoke" ticked. Runs the
  # binaries this run just built on the systems they are for -- the build
  # jobs above can only check how they are linked -- with Linux as the
  # reference for what QuicPollEventLoop expects from poll(). See
  # testing/smoke/README.md. Both macOS architectures, and Windows twice:
  # Server 2022 is the closest image to the oldest Windows quictun runs on
  # (10 2004), Server 2025 the newest.
  smoke:
    name: Smoke (${{ matrix.runner }})
    if: ${{ inputs.smoke }}
    needs: [build-linux, build-macos, build-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: quictun-linux-x86_64
          - runner: macos-15
            artifact: quictun-macos-arm64
          - runner: macos-15-intel
            artifact: quictun-macos-x86_64
          - runner: windows-2022
            artifact: quictun-windows-x86_64
          - runner: windows-2025
            artifact: quictun-windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ${{ matrix.artifact }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin

      - name: Probe poll() and select()
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" testing/smoke/poll_probe.py

      - name: Smoke test
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" testing/smoke/smoke_test.py bin
