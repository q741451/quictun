name: Build

on:
  push:
    branches: [ quictun ]
  pull_request:
    branches: [ quictun ]
  workflow_dispatch:

# Binaries built on every run. These are QUICHE's own tools (this branch is
# a vendored QUICHE snapshot, no quictun-specific application code yet).
env:
  TARGETS: >-
    //quiche:quic_client
    //quiche:quic_server
    //quiche:masque_client
    //quiche:masque_server

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Every architecture (including x86_64) uses the same from-scratch,
    # pinned, Chromium-style toolchain -- Chromium's own pinned clang, a
    # from-source libc++ built by that clang, and glibc pinned to a fixed
    # Ubuntu archive snapshot -- built by build/toolchain/setup_toolchain.sh
    # and wired into Bazel via build/toolchain/BUILD.bazel's --platforms.
    # See that BUILD.bazel file's header comment for the full rationale:
    # in short, none of this depends on which Ubuntu release happens to be
    # running the build, which is what broke this project's mipsel build
    # once already (see git history).
    #
    # Plain big-endian mips is deliberately not in this matrix: quiche's
    # own README states it only supports little-endian platforms, and
    # that's a correctness concern (silently wrong crypto/wire-format
    # handling), not just a build-break one. mipsel (little-endian) is.
    strategy:
      fail-fast: false
      matrix:
        include:
          # static_flag: -static-pie where the pinned glibc snapshot ships
          # rcrt1.o (x86_64, arm64); plain -static elsewhere. Debian/Ubuntu's
          # armhf and mipsel cross-glibc builds at this snapshot don't ship
          # rcrt1.o (the static-PIE start file) at all -- verified locally,
          # confirmed by identical "ld.lld: error: cannot open rcrt1.o" on
          # real CI for both. Plain -static works fine on both (verified
          # locally for armv7's full quic_client; mipsel was already
          # verified with plain -static earlier this session, before this
          # toolchain rewrite) -- neither hits the dlopen/-fPIC relocation
          # issue that forced -static-pie on x86_64 in the first place,
          # since that's specific to glibc 2.34+'s x86_64 static libc.a.
          - name: x86_64
            platform: linux_x64
            file_match: "x86-64"
            static_flag: -static-pie
          - name: arm64
            platform: linux_arm64
            file_match: "ARM aarch64"
            static_flag: -static-pie
          - name: armv7
            platform: linux_armv7
            file_match: "ARM,"
            static_flag: -static
          - name: mipsel
            platform: linux_mipsel
            file_match: "MIPS,"
            static_flag: -static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain itself (pinned clang download + from-source libc++
      # build) doesn't change unless the pins in setup_toolchain.sh do, so
      # it's cached separately from -- and is a much bigger win than --
      # Bazel's own repository/output caches below: a hit here skips
      # several minutes of `ninja` building libc++/libc++abi/libunwind
      # from source.
      # Every cross-compile job (arm64/armv7/mipsel) also needs a full x64
      # toolchain, not just its target arch's: Bazel builds a handful of
      # build-time tool dependencies (protoc and its transitive deps, e.g.
      # abseil "[for tool]" targets) for the *exec* platform, which is the
      # x64 GitHub runner itself, regardless of --platforms=. Confirmed by
      # a real CI failure (all three cross jobs failed identically with
      # "cstdint file not found" while compiling absl "[for tool]" targets
      # against -isystem /opt/libcxx-x64/..., because that directory simply
      # didn't exist yet on those runners).
      - name: Cache toolchain (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: |
            /opt/chromium-clang
            /opt/libcxx-x64
            /opt/libcxx-${{ matrix.name == 'x86_64' && 'x64' || matrix.name }}
          key: toolchain-${{ matrix.name }}-${{ hashFiles('build/toolchain/setup_toolchain.sh') }}

      - name: Set up pinned toolchain (${{ matrix.name }})
        run: |
          set -e
          bash build/toolchain/setup_toolchain.sh x64
          ARCH=${{ matrix.name == 'x86_64' && 'x64' || matrix.name }}
          if [ "$ARCH" != "x64" ]; then
            bash build/toolchain/setup_toolchain.sh "$ARCH"
          fi

      # BoringSSL/abseil/protobuf/googleurl are all built from source via
      # quiche's own Bazel setup -- that's the single biggest cost in this
      # job besides the toolchain itself, so cache Bazel's repository +
      # build output caches keyed on the lockfile, .bazelrc, and the
      # toolchain BUILD file.
      - name: Cache Bazel (${{ matrix.name }})
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-${{ matrix.name }}
            ~/.cache/bazelisk
          key: bazel-${{ matrix.name }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', 'build/toolchain/BUILD.bazel', 'build/toolchain/toolchain_flags.bzl') }}
          restore-keys: |
            bazel-${{ matrix.name }}-

      - name: Install bazelisk
        run: |
          curl -fsSL -o /tmp/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /tmp/bazelisk
          sudo mv /tmp/bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel

      - name: Build
        run: |
          set -e
          nproc
          # .bazelrc already carries the Chromium-aligned default flags
          # (OPENSSL_SMALL, fno-rtti/exceptions, hidden visibility,
          # function/data sections, bundled ICU, etc). Only add what's
          # specific to this CI artifact: static linking + stripped size.
          # matrix.static_flag picks -static-pie vs plain -static -- see
          # the matrix comment above for why this differs per arch.
          bazel build -c opt \
            --platforms=//build/toolchain:${{ matrix.platform }} \
            --linkopt=${{ matrix.static_flag }} \
            --linkopt=-s \
            $TARGETS

      - name: Stage artifacts
        run: |
          set -e
          mkdir -p dist
          for t in $TARGETS; do
            name=${t#//quiche:}
            cp "bazel-bin/quiche/$name" "dist/${name}-linux-${{ matrix.name }}"
          done
          chmod +x dist/*
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q '${{ matrix.file_match }}' || { echo "::error::$f is not a ${{ matrix.name }} binary"; exit 1; }
            file "$f" | grep -qE "statically linked|static-pie linked" || { echo "::error::$f is not statically linked"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiche-tools-linux-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
